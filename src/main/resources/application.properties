spring.application.name=DeuTrust

# ==========================================
# DEFAULT PROFILE: Local SQLite Database
# ==========================================
# Enables SQLite database file for MVP persistence
spring.datasource.url=jdbc:sqlite:deutrust.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA/Hibernate schema configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.connection.charSet=UTF-8

# ==========================================
# PRODUCTION PROFILE: PostgreSQL
# ==========================================
# Uncomment these parameters and specify correct credentials when running PostgreSQL
# spring.datasource.url=jdbc:postgresql://localhost:5432/deutrust
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# SWAGGER / OPENAPI CONFIGURATION
# ==========================================
# Access Swagger UI at http://localhost:8081/swagger-ui/index.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ==========================================
# REVERSE PROXY & FORWARDED HEADERS (ngrok)
# ==========================================
# Ensures Spring Boot correctly resolves the HTTPS schema and public host from X-Forwarded-* headers
server.forward-headers-strategy=FRAMEWORK

# Optional: Force a static public URL for the Verifier (useful for local troubleshooting)
eudi.public-url=https://laundry-sterile-chug.ngrok-free.dev

# ==========================================
# SERVER PORT CONFIGURATION
# ==========================================
# Configure Spring Boot to run on port 8081 to avoid conflicts with OrbStack/Docker
server.port=8081
